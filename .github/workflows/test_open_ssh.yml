
name: Direct SSH Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "Host is configured: $([ -n "$VM_HOST" ] && echo YES || echo NO)"
          echo "User is configured: $([ -n "$VM_USER" ] && echo YES || echo NO)"
          echo "Port is configured: $([ -n "$VM_PORT" ] && echo YES || echo NO)"
          echo "Key is configured: $([ -n "$VM_SSH_KEY" ] && echo YES || echo NO)"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'echo "SSH connection successful!"; whoami; hostname'
