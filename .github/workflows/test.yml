name: Test VM Host

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check VM_HOST
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "Checking VM_HOST..."

          if [ -z "$VM_HOST" ]; then
            echo "❌ VM_HOST is EMPTY"
            exit 1
          fi

          echo "✅ VM_HOST is available"
          echo "Host length: ${#VM_HOST}"
